<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hội Thảo Chuyển Đổi Số Trong Trường Học - Thư Viện Tài Liệu Số</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1e293b;
            color: #f8fafc;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .topic-card {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .topic-card h2 { margin-top: 0; color: #60a5fa; font-size: 16px; }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
        }

        #status { margin-top: 8px; font-weight: bold; color: #34d399; text-align: center; font-size: 14px; }

        .book-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #book {
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .page {
            background-color: #fff8f0;
            color: #1e293b;
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }
        .page img { max-width: 100%; height: auto; display: block; margin: 10px auto; }

        .nav-btns {
            margin: 15px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #1d4ed8; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <header>
        <div style="font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; color: #cbd5e1; margin-bottom: 6px;">
            TRƯỜNG THPT CHUYÊN LÊ QUÝ ĐÔN
        </div>
        <h1 style="margin: 0 0 6px 0; font-size: 20px; text-transform: uppercase; line-height: 1.3;">
            HỘI THẢO CHUYỂN ĐỔI SỐ TRONG TRƯỜNG HỌC
        </h1>
        <p style="margin: 0; opacity: 0.9; font-size: 13px;">
            📖 Thư viện Tài liệu & Báo cáo Số
        </p>
    </header>

    <div class="container">
        <div class="topic-card">
            <h2>📌 Chọn Tài liệu trải nghiệm:</h2>
            <select id="topicSelect" onchange="loadReport(this.value)">
                <option value="">-- Kính mời Đại biểu chọn tài liệu --</option>
            </select>
            <div id="status"></div>
        </div>

        <div class="book-wrapper" id="bookWrapper">
            <div class="nav-btns">
                <button class="btn" onclick="pageFlip.flipPrev()">◀ Trước</button>
                <button class="btn" onclick="pageFlip.flipNext()">Sau ▶</button>
            </div>
            <div id="book"></div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "Phamtanlqd";
        const REPO_NAME = "hoithaocdslequydon";
        const FOLDER_PATH = "data";

        window.onload = function() {
            fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`)
                .then(res => res.json())
                .then(files => {
                    const selectBox = document.getElementById('topicSelect');
                    files.forEach(file => {
                        if (file.name.endsWith('.docx')) {
                            const option = document.createElement('option');
                            option.value = file.download_url;
                            let displayName = file.name.replace('.docx', '').replace(/-/g, ' ');
                            displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                            option.textContent = "📄 " + displayName;
                            selectBox.appendChild(option);
                        }
                    });
                })
                .catch(err => {
                    console.error("Lỗi tải danh sách:", err);
                    document.getElementById('status').innerText = "❌ Không thể tải danh sách tài liệu.";
                });
        };

        let pageFlip = null;

        function loadReport(fileUrl) {
            if (!fileUrl) return;
            const status = document.getElementById('status');
            status.innerText = "⏳ Đang tải và dựng tài liệu...";

            fetch(fileUrl)
                .then(res => {
                    if (!res.ok) throw new Error("Không tìm thấy file!");
                    return res.arrayBuffer();
                })
                .then(arrayBuffer => {
                    return mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, {
                        convertImage: mammoth.images.imgElement(img => {
                            return img.read("base64").then(b64 => ({ src: "data:" + img.contentType + ";base64," + b64 }));
                        })
                    });
                })
                .then(result => {
                    status.innerText = "✅ Tải xong! Mời đại biểu xem tài liệu.";
                    renderFlipbook(result.value);
                })
                .catch(err => {
                    status.innerText = "❌ Lỗi: " + err.message;
                });
        }

        function renderFlipbook(htmlContent) {
            const bookDiv = document.getElementById('book');
            bookDiv.innerHTML = '';

            const temp = document.createElement('div');
            temp.innerHTML = htmlContent;
            const nodes = Array.from(temp.childNodes);

            let currentPage = document.createElement('div');
            currentPage.className = 'page';
            let length = 0;

            nodes.forEach(node => {
                const len = node.textContent ? node.textContent.length : 0;
                if (length > 500 && ['H1','H2','P'].includes(node.nodeName)) {
                    bookDiv.appendChild(currentPage);
                    currentPage = document.createElement('div');
                    currentPage.className = 'page';
                    length = 0;
                }
                currentPage.appendChild(node.cloneNode(true));
                length += len;
            });
            if (currentPage.childNodes.length > 0) bookDiv.appendChild(currentPage);

            document.getElementById('bookWrapper').style.display = 'flex';

            if (pageFlip) pageFlip.destroy();

            const isMobile = window.innerWidth < 768;
            
            pageFlip = new St.PageFlip(bookDiv, {
                width: isMobile ? 320 : 420,
                height: isMobile ? 480 : 580,
                size: isMobile ? "fixed" : "stretch",
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            if (window.MathJax) MathJax.typesetPromise([bookDiv]);
        }
    </script>
</body>
</html>
