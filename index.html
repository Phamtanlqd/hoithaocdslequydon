<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hội Thảo Chuyển Đổi Số - Trường THPT Chuyên Lê Quý Đôn</title>
    <style>
        * { box-sizing: border-box; }
        
        /* Nền phong cách Trung tâm điều hành số (Digital Command Center) */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                linear-gradient(to right, rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: #f8fafc;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header kính mờ công nghệ cao */
        header {
            width: 100%;
            max-width: 950px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 20px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Thêm dải sáng chạy ngang header tạo hiệu ứng quét công nghệ */
        header::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            animation: scanLine 4s linear infinite;
        }

        @keyframes scanLine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Thẻ điều khiển tài liệu */
        .topic-card {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.3);
            position: relative;
        }

        .topic-card h2 { 
            margin-top: 0; 
            color: #38bdf8; 
            font-size: 16px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background-color: rgba(2, 6, 23, 0.95);
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        select:focus { 
            border-color: #38bdf8; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); 
        }

        #status { 
            margin-top: 12px; 
            font-weight: 600; 
            color: #34d399; 
            text-align: center; 
            font-size: 14px; 
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        /* Huy hiệu trạng thái chuyển đổi số trực tuyến */
        .system-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* Khung hiển thị sách 3D */
        .book-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #book {
            margin: 0 auto;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95), 0 0 60px rgba(14, 165, 233, 0.2);
            border-radius: 8px;
        }

        /* Trang sách cao cấp */
        .page {
            background-color: #fffdf9;
            color: #1e293b;
            padding: 30px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            box-shadow: inset 12px 0 25px rgba(0, 0, 0, 0.05);
        }
        .page img { max-width: 100%; height: auto; display: block; margin: 15px auto; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .page h1, .page h2, .page h3 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }

        /* Nút chuyển trang Cyberpunk/Modern Gradient */
        .nav-btns {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .btn:hover { 
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.6);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <header>
        <div class="system-badge">
            <div class="pulse-dot"></div> Đã kết nối hệ thống dữ liệu số
        </div>
        <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2.5px; color: #38bdf8; margin-bottom: 6px;">
            TRƯỜNG THPT CHUYÊN LÊ QUÝ ĐÔN
        </div>
        <h1 style="margin: 0 0 8px 0; font-size: 21px; text-transform: uppercase; line-height: 1.4; color: #ffffff;">
            HỘI THẢO CHUYỂN ĐỔI SỐ TRONG TRƯỜNG HỌC
        </h1>
        <p style="margin: 0; opacity: 0.9; font-size: 13px; color: #94a3b8;">
            📖 Cổng Tri Thức & Thư Viện Tài Liệu Số Trực Tuyến
        </p>
    </header>

    <div class="container">
        <div class="topic-card">
            <h2>📌 Chọn Tài liệu trực tuyến:</h2>
            <select id="topicSelect" onchange="loadReport(this.value)">
                <option value="">-- Kính mời Đại biểu chọn tài liệu --</option>
            </select>
            <div id="status"></div>
        </div>

        <div class="book-wrapper" id="bookWrapper">
            <div class="nav-btns">
                <button class="btn" onclick="pageFlip.flipPrev()">◀ Trang Trước</button>
                <button class="btn" onclick="pageFlip.flipNext()">Trang Sau ▶</button>
            </div>
            <div id="book"></div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "Phamtanlqd";
        const REPO_NAME = "hoithaocdslequydon";
        const FOLDER_PATH = "data";

        window.onload = function() {
            fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`)
                .then(res => res.json())
                .then(files => {
                    const selectBox = document.getElementById('topicSelect');
                    files.forEach(file => {
                        if (file.name.endsWith('.docx')) {
                            const option = document.createElement('option');
                            option.value = file.download_url;
                            let displayName = file.name.replace('.docx', '').replace(/-/g, ' ');
                            displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                            option.textContent = "📄 " + displayName;
                            selectBox.appendChild(option);
                        }
                    });
                })
                .catch(err => {
                    console.error("Lỗi tải danh sách:", err);
                    document.getElementById('status').innerText = "❌ Không thể tải danh sách tài liệu.";
                });
        };

        let pageFlip = null;

        function loadReport(fileUrl) {
            if (!fileUrl) return;
            const status = document.getElementById('status');
            status.innerText = "⏳ Đang trích xuất và khởi tạo sách số...";

            fetch(fileUrl)
                .then(res => {
                    if (!res.ok) throw new Error("Không tìm thấy file!");
                    return res.arrayBuffer();
                })
                .then(arrayBuffer => {
                    return mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, {
                        convertImage: mammoth.images.imgElement(img => {
                            return img.read("base64").then(b64 => ({ src: "data:" + img.contentType + ";base64," + b64 }));
                        })
                    });
                })
                .then(result => {
                    status.innerText = "✅ Hoàn tất! Kính mời đại biểu trải nghiệm.";
                    renderFlipbook(result.value);
                })
                .catch(err => {
                    status.innerText = "❌ Lỗi: " + err.message;
                });
        }

        function renderFlipbook(htmlContent) {
            const bookDiv = document.getElementById('book');
            bookDiv.innerHTML = '';

            const temp = document.createElement('div');
            temp.innerHTML = htmlContent;
            const nodes = Array.from(temp.childNodes);

            let currentPage = document.createElement('div');
            currentPage.className = 'page';
            let length = 0;

            nodes.forEach(node => {
                const len = node.textContent ? node.textContent.length : 0;
                if (length > 500 && ['H1','H2','P'].includes(node.nodeName)) {
                    bookDiv.appendChild(currentPage);
                    currentPage = document.createElement('div');
                    currentPage.className = 'page';
                    length = 0;
                }
                currentPage.appendChild(node.cloneNode(true));
                length += len;
            });
            if (currentPage.childNodes.length > 0) bookDiv.appendChild(currentPage);

            document.getElementById('bookWrapper').style.display = 'flex';

            if (pageFlip) pageFlip.destroy();

            const isMobile = window.innerWidth < 768;
            
            pageFlip = new St.PageFlip(bookDiv, {
                width: isMobile ? 320 : 440,
                height: isMobile ? 480 : 600,
                size: isMobile ? "fixed" : "stretch",
                maxShadowOpacity: 0.6,
                showCover: true,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            if (window.MathJax) MathJax.typesetPromise([bookDiv]);
        }
    </script>
</body>
</html>
