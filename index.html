<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hội Thảo Chuyển Đổi Số Trong Trường Học - Trường THPT Chuyên Lê Quý Đôn</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header sang trọng */
        header {
            width: 100%;
            max-width: 950px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #1d4ed8);
            padding: 25px 20px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        /* Thẻ chọn tài liệu */
        .topic-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .topic-card h2 { 
            margin-top: 0; 
            color: #38bdf8; 
            font-size: 16px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0b0f19;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        #status { 
            margin-top: 12px; 
            font-weight: 600; 
            color: #34d399; 
            text-align: center; 
            font-size: 14px; 
        }

        /* Khung hiển thị sách lật */
        .book-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #book {
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
        }

        /* Tờ giấy đọc sách mượt mà */
        .page {
            background-color: #fcfaf2; /* Màu giấy kem cao cấp */
            color: #1e293b;
            padding: 25px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
        }
        .page img { max-width: 100%; height: auto; display: block; margin: 15px auto; border-radius: 6px; }
        .page h1, .page h2, .page h3 { color: #0f172a; }

        /* Nút chuyển trang hiện đại */
        .nav-btns {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s;
        }
        .btn:hover { 
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
        }
        .btn:active { transform: translateY(0); }
    </style>

    <!-- Thư viện hỗ trợ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <header>
        <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #93c5fd; margin-bottom: 8px;">
            TRƯỜNG THPT CHUYÊN LÊ QUÝ ĐÔN
        </div>
        <h1 style="margin: 0 0 8px 0; font-size: 20px; text-transform: uppercase; line-height: 1.4; color: #ffffff;">
            HỘI THẢO CHUYỂN ĐỔI SỐ TRONG TRƯỜNG HỌC
        </h1>
        <p style="margin: 0; opacity: 0.9; font-size: 13px; color: #e2e8f0;">
            📖 Thư viện Tài liệu & Báo cáo Số Trực Tuyến
        </p>
    </header>

    <div class="container">
        <div class="topic-card">
            <h2>📌 Chọn Tài liệu trải nghiệm:</h2>
            <select id="topicSelect" onchange="loadReport(this.value)">
                <option value="">-- Kính mời Đại biểu chọn tài liệu --</option>
            </select>
            <div id="status"></div>
        </div>

        <div class="book-wrapper" id="bookWrapper">
            <div class="nav-btns">
                <button class="btn" onclick="pageFlip.flipPrev()">◀ Trang Trước</button>
                <button class="btn" onclick="pageFlip.flipNext()">Trang Sau ▶</button>
            </div>
            <div id="book"></div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "Phamtanlqd";
        const REPO_NAME = "hoithaocdslequydon";
        const FOLDER_PATH = "data";

        window.onload = function() {
            fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`)
                .then(res => res.json())
                .then(files => {
                    const selectBox = document.getElementById('topicSelect');
                    files.forEach(file => {
                        if (file.name.endsWith('.docx')) {
                            const option = document.createElement('option');
                            option.value = file.download_url;
                            let displayName = file.name.replace('.docx', '').replace(/-/g, ' ');
                            displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                            option.textContent = "📄 " + displayName;
                            selectBox.appendChild(option);
                        }
                    });
                })
                .catch(err => {
                    console.error("Lỗi tải danh sách:", err);
                    document.getElementById('status').innerText = "❌ Không thể tải danh sách tài liệu.";
                });
        };

        let pageFlip = null;

        function loadReport(fileUrl) {
            if (!fileUrl) return;
            const status = document.getElementById('status');
            status.innerText = "⏳ Đang tải và dựng tài liệu...";

            fetch(fileUrl)
                .then(res => {
                    if (!res.ok) throw new Error("Không tìm thấy file!");
                    return res.arrayBuffer();
                })
                .then(arrayBuffer => {
                    return mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, {
                        convertImage: mammoth.images.imgElement(img => {
                            return img.read("base64").then(b64 => ({ src: "data:" + img.contentType + ";base64," + b64 }));
                        })
                    });
                })
                .then(result => {
                    status.innerText = "✅ Tải xong! Mời đại biểu xem tài liệu.";
                    renderFlipbook(result.value);
                })
                .catch(err => {
                    status.innerText = "❌ Lỗi: " + err.message;
                });
        }

        function renderFlipbook(htmlContent) {
            const bookDiv = document.getElementById('book');
            bookDiv.innerHTML = '';

            const temp = document.createElement('div');
            temp.innerHTML = htmlContent;
            const nodes = Array.from(temp.childNodes);

            let currentPage = document.createElement('div');
            currentPage.className = 'page';
            let length = 0;

            nodes.forEach(node => {
                const len = node.textContent ? node.textContent.length : 0;
                if (length > 500 && ['H1','H2','P'].includes(node.nodeName)) {
                    bookDiv.appendChild(currentPage);
                    currentPage = document.createElement('div');
                    currentPage.className = 'page';
                    length = 0;
                }
                currentPage.appendChild(node.cloneNode(true));
                length += len;
            });
            if (currentPage.childNodes.length > 0) bookDiv.appendChild(currentPage);

            document.getElementById('bookWrapper').style.display = 'flex';

            if (pageFlip) pageFlip.destroy();

            const isMobile = window.innerWidth < 768;
            
            pageFlip = new St.PageFlip(bookDiv, {
                width: isMobile ? 310 : 420,
                height: isMobile ? 460 : 580,
                size: isMobile ? "fixed" : "stretch",
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            if (window.MathJax) MathJax.typesetPromise([bookDiv]);
        }
    </script>
</body>
</html>
